[package]
name = "elvui_update"
version = "2.0.0"
edition = "2021"
description = "Keeps ElvUI up to date in every World of Warcraft install"
license = "GPL-3.0"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
