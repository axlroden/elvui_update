name: Build and release

on:
  push:
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: elvui_update-windows.exe
          - os: macos-latest
            name: elvui_update-macos
          - os: ubuntu-latest
            name: elvui_update-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          # Static C runtime, so the .exe runs without the VC++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          copy target\release\elvui_update.exe ${{ matrix.name }}

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output ${{ matrix.name }} \
            target/x86_64-apple-darwin/release/elvui_update \
            target/aarch64-apple-darwin/release/elvui_update

      - name: Build (Linux static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/elvui_update ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body_path: changelog.txt
          files: dist/*